<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym 50 Maalmood — Jadwalka Xoogga</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eee8;
    --text2: #a09e98;
    --text3: #5a5855;
    --accent: #e8ff4a;
    --accent2: #ff6b35;
    --accent3: #4af0c8;
    --purple: #b48fff;
    --red: #ff4a4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND GRID */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* HEADER */
  header {
    padding: 60px 0 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .header-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .logo-area h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(52px, 8vw, 90px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -2px;
    color: var(--text);
  }

  .logo-area h1 span {
    color: var(--accent);
    display: block;
  }

  .logo-area p {
    font-size: 13px;
    color: var(--text3);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 12px;
  }

  .header-stats {
    display: flex;
    gap: 2px;
  }

  .hstat {
    background: var(--bg3);
    border: 1px solid var(--border);
    padding: 16px 20px;
    text-align: center;
    min-width: 90px;
  }

  .hstat:first-child { border-radius: 8px 0 0 8px; }
  .hstat:last-child { border-radius: 0 8px 8px 0; }

  .hstat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .hstat-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* PROGRESS BAR */
  .progress-section {
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text3);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  /* WEEK TABS */
  .week-tabs {
    display: flex;
    gap: 4px;
    padding: 28px 0 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .week-tabs::-webkit-scrollbar { display: none; }

  .wtab {
    flex-shrink: 0;
    padding: 10px 18px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text3);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .wtab::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transition: transform 0.2s;
  }

  .wtab:hover { border-color: var(--border2); color: var(--text2); }

  .wtab.active {
    background: var(--bg3);
    border-color: var(--accent);
    color: var(--accent);
  }

  .wtab.active::before { transform: scaleX(1); }

  /* WEEK HEADER */
  .week-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .wk-left { display: flex; align-items: center; gap: 16px; }

  .wk-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--bg3);
    -webkit-text-stroke: 1px var(--border2);
    user-select: none;
  }

  .wk-info h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .wk-info p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }

  .intensity-bar {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .int-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border2);
    transition: background 0.3s;
  }

  .int-dot.on { background: var(--accent); }

  /* DAYS GRID */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    padding-bottom: 60px;
  }

  /* DAY CARD */
  .day-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .day-card:hover {
    border-color: var(--border2);
    transform: translateY(-2px);
  }

  .day-card.is-rest {
    border-left: 3px solid var(--accent3);
    opacity: 0.7;
  }

  .day-card.is-hiit { border-left: 3px solid var(--accent2); }
  .day-card.is-strength { border-left: 3px solid var(--accent); }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }

  .day-num-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
  }

  .type-tag {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
  }

  .tag-strength { background: rgba(232,255,74,0.12); color: var(--accent); }
  .tag-hiit { background: rgba(255,107,53,0.12); color: var(--accent2); }
  .tag-rest { background: rgba(74,240,200,0.12); color: var(--accent3); }

  .card-title {
    padding: 12px 16px 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.3px;
  }

  .card-rest-msg {
    padding: 8px 16px 16px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
  }

  /* EXERCISE TABLE */
  .exercise-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .exercise-table tr {
    border-top: 1px solid var(--border);
    transition: background 0.15s;
  }

  .exercise-table tr:hover { background: rgba(255,255,255,0.02); }

  .exercise-table td {
    padding: 8px 16px;
    vertical-align: middle;
  }

  .ex-name {
    color: var(--text);
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--border2);
    text-underline-offset: 3px;
    transition: color 0.15s;
  }

  .ex-name:hover { color: var(--accent); }

  .ex-badges {
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .badge-kg { background: rgba(232,255,74,0.1); color: var(--accent); border: 1px solid rgba(232,255,74,0.2); }
  .badge-sets { background: rgba(255,255,255,0.06); color: var(--text2); }
  .badge-ab { background: rgba(255,107,53,0.12); color: var(--accent2); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    max-width: 520px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg2);
  }

  .modal-head h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }

  .modal-close {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .modal-close:hover { border-color: var(--border2); color: var(--text); }

  .modal-body { padding: 20px 24px 24px; }

  .modal-row {
    margin-bottom: 18px;
  }

  .modal-row-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .modal-row-val {
    font-size: 14px;
    color: var(--text);
    line-height: 1.65;
  }

  .modal-row-val strong {
    color: var(--accent);
    font-weight: 600;
  }

  .ab-chip {
    display: inline-block;
    background: rgba(255,107,53,0.12);
    color: var(--accent2);
    border: 1px solid rgba(255,107,53,0.25);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .yt-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #ff0000;
    color: #fff;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: opacity 0.15s;
    margin-top: 8px;
  }

  .yt-btn:hover { opacity: 0.85; }

  .yt-icon {
    width: 20px;
    height: 14px;
    background: white;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .yt-icon::after {
    content: '';
    width: 0;
    height: 0;
    border-left: 7px solid #ff0000;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    margin-left: 2px;
  }

  /* WEEK CONTENT */
  .week-content { padding-top: 20px; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 0;
    text-align: center;
    font-size: 12px;
    color: var(--text3);
    letter-spacing: 1px;
  }

  @media (max-width: 600px) {
    .days-grid { grid-template-columns: 1fr; }
    .header-stats { flex-wrap: wrap; }
    .hstat { min-width: 70px; padding: 12px 14px; }
    .hstat-val { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div class="logo-area">
        <h1>JADWAL<span>GYM</span></h1>
        <p>50 Maalmood &mdash; Calool · Murqo · Xoog</p>
      </div>
      <div class="header-stats">
        <div class="hstat"><div class="hstat-val">50</div><div class="hstat-label">Maalmood</div></div>
        <div class="hstat"><div class="hstat-val">7</div><div class="hstat-label">Isbuuc</div></div>
        <div class="hstat"><div class="hstat-val">30+</div><div class="hstat-label">Jimicsi</div></div>
        <div class="hstat"><div class="hstat-val">1</div><div class="hstat-label">Nasasho</div></div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-label">
        <span>Horumar Guud</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="week-tabs" id="weekTabs"></div>
  </header>

  <!-- WEEK CONTENT -->
  <div class="week-content" id="weekContent"></div>
</div>

<footer>
  <div class="container">NASO · CUN CAAFIMAAD · BIYO CAB — GOOL GAARO</div>
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="mTitle"></h3>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div id="mAbChip"></div>
      <div class="modal-row">
        <div class="modal-row-label">Qaybta Jirka</div>
        <div class="modal-row-val" id="mMuscle"></div>
      </div>
      <div class="modal-row">
        <div class="modal-row-label">Sida Loo Sameeyo</div>
        <div class="modal-row-val" id="mHow"></div>
      </div>
      <div class="modal-row">
        <div class="modal-row-label">Culeyska La Talin Karo</div>
        <div class="modal-row-val" id="mKg"></div>
      </div>
      <a href="#" id="mYT" target="_blank" class="yt-btn">
        <span class="yt-icon"></span> Fiiri YouTube
      </a>
    </div>
  </div>
</div>

<script>
const exerciseDB = {
  "Barbell Squat": { muscle: "Lugta oo dhan, Gluteus, Kore-lugeedka (quads, hamstrings, glutes)", how: "La taag si toosan, cagaha oo ballaaran, gacmaha bar ku dhufo. Si tartiib ah u hooyo ilaa dhaqdhaqaaqa 90° ama ka hooseeya, dhabarka toosna hay. Kadib si xoog ah dib ugu laabo taagan.", kg: "Bilow: 20kg · Xoogaahe: 40–60kg · Xoogan: 80kg+", calool: false, yt: "https://www.youtube.com/results?search_query=barbell+squat+proper+form+tutorial" },
  "Romanian Deadlift": { muscle: "Garbaha dambe, Gluteus, Hamstrings, Core", how: "Taag si toosan, barbell gacmaha ku hay. Garbaha dambe ku laab adoo lugo jilicsan; bar hoos u geli ilaa gabdhaha gadood, dabadeed tooso.", kg: "Bilow: 20kg · Xoogaahe: 50–70kg · Xoogan: 90kg+", calool: false, yt: "https://www.youtube.com/results?search_query=romanian+deadlift+tutorial" },
  "Bench Press": { muscle: "Laabta hore (pectorals), Garbaha sare, Gacmaha gadood (triceps)", how: "Ku jiif banchi-ga si toosan, gacmaha ballaaran bar ku dhufo. Si tartiib soo deji bar laabta, ku taabasho, kadib xoog kor u riix.", kg: "Bilow: 20kg · Xoogaahe: 40–60kg · Xoogan: 80kg+", calool: false, yt: "https://www.youtube.com/results?search_query=bench+press+form+tutorial" },
  "Pull-ups": { muscle: "Dhabarka ballaaran (latissimus dorsi), Biceps, Core", how: "Bar ku dhufo gacmaha adoo ballaaran. Cududaha xoog u kabo, si tartiib ah jiid meesha joogto ilaa garbahu banchi-ga ku dhadhanto.", kg: "Culeyska jirkaaga + 5–20kg belt ku xidmo", calool: false, yt: "https://www.youtube.com/results?search_query=pull+ups+proper+form+tutorial" },
  "Overhead Press": { muscle: "Garbaha (deltoid oo dhan), Gacmaha gadood (triceps)", how: "Taag toosan, barbell laabta sare saaran gacmaha ballaaran. Si toosan kor ugu riix ilaa gacmahu fudud yimaaddo, dib u soo ceeli tartiib.", kg: "Bilow: 15kg · Xoogaahe: 35–50kg · Xoogan: 65kg+", calool: false, yt: "https://www.youtube.com/results?search_query=overhead+press+tutorial" },
  "Deadlift": { muscle: "Dhabarka oo dhan, Gluteus, Lugaha, Core", how: "Ku istaag bar dhulka saaran, gacmaha soo dhow. Jiid si toosan, dhabarka ha laabnayn, laabka calool ku xukumi. Taag si buuxda, bar ku laabtay.", kg: "Bilow: 30kg · Xoogaahe: 60–100kg · Xoogan: 120kg+", calool: false, yt: "https://www.youtube.com/results?search_query=deadlift+proper+form+beginner" },
  "Plank": { muscle: "Caloolaha oo dhan (rectus, obliques, transverse), Garbaha, Xididdada dhabarka", how: "Ku jiif geesaha cududaha iyo faraha, jirka oo toosan sidii muus. Laabta kor u qaad, caloolaha xoog ku hayso, neefsashada sii wad.", kg: "Jirkaaga + adag: hal gacmo / hal lugood ku samee", calool: true, yt: "https://www.youtube.com/results?search_query=perfect+plank+form+tutorial" },
  "Crunches": { muscle: "Rectus abdominis (caloolaha hore)", how: "Ku jiif dhabarka, lugaha la buuxshay, gacmaha madaxa saaran. Kor u qaad garabkii si tartiib ah caloolaha kaga dul curis, hoos u soo celi.", kg: "Jirkaaga + adag: plate 5–10kg laab ku hayso", calool: true, yt: "https://www.youtube.com/results?search_query=proper+crunches+ab+exercise" },
  "Leg Raises": { muscle: "Caloolaha hoose (lower abs), Hip flexors", how: "Ku jiif dhabarka, gacmaha xagga lugaha dhig. Lugaha si toosan kor u qaad ilaa 90°, hoos u soo ceeli tartiib caloolaha xukuminaya.", kg: "Jirkaaga + ankle weights 2–8kg", calool: true, yt: "https://www.youtube.com/results?search_query=leg+raises+abs+lower+ab" },
  "Russian Twists": { muscle: "Caloolaha dhinacyada (obliques), Core", how: "Fadhiiso xagay ku diri, lugaha kor u qaad. Gacanta medball ama plate ku hay, garab midig ka guri, kadib bidix, oo caloolaha xukuminaya.", kg: "2–12kg plate ama medball", calool: true, yt: "https://www.youtube.com/results?search_query=russian+twists+obliques" },
  "Cable Crunch": { muscle: "Caloolaha hore (rectus abdominis)", how: "Jilbaha dhig cable machine hoosta, rope ku dhufo madaxa. Hoos u dhufo si xoog ah caloolaha kaga dul curis, dib u tooso tartiib.", kg: "20–50kg cable", calool: true, yt: "https://www.youtube.com/results?search_query=cable+crunch+ab+exercise+form" },
  "Mountain Climbers": { muscle: "Core, Garbaha, Cardio xooggan", how: "Bilaaw push-up xaalad. Si degdeg ah lugaha isla jajab, mid hore mid gadood, gacmaha toosan hayso.", kg: "Jirkaaga", calool: true, yt: "https://www.youtube.com/results?search_query=mountain+climbers+exercise+form" },
  "HIIT Sprints": { muscle: "Jirka oo dhan, Cardio xooggan, Caloolaha", how: "30 ilbiriqsi orod ama cycle xoog ah, kadib 30 sec nasasho. Ku celi 10–20 wareeg. Ama treadmill 10/10 protocol.", kg: "Jirkaaga", calool: false, yt: "https://www.youtube.com/results?search_query=HIIT+sprints+fat+burn+workout" },
  "Burpees": { muscle: "Jirka oo dhan — cardio xooggan", how: "Taag → jilbaha dhig → push-up samee → dib u kac → kor u boodo, gacantu madax ku dhadhanto. Si degdeg ah u samee.", kg: "Jirkaaga", calool: false, yt: "https://www.youtube.com/results?search_query=burpees+proper+form+tutorial" },

let completedDays = new Set(JSON.parse(localStorage.getItem('gym50_done') || '[]'));

function saveCompleted() {
  localStorage.setItem('gym50_done', JSON.stringify([...completedDays]));
}

function buildTabs() {
  const nav = document.getElementById('weekTabs');
  nav.innerHTML = weekData.map((w,i) =>
    `<button class="wtab${i===0?' active':''}" onclick="setWeek(${i})">ISB ${i+1}</button>`
  ).join('');
}

function setWeek(i) {
  currentWeek = i;
  document.querySelectorAll('.wtab').forEach((b,idx) => b.classList.toggle('active', idx===i));
  renderWeek();
  updateProgress();
}

function typeInfo(t) {
  if(t==='rest') return {cls:'is-rest', tag:'<span class="type-tag tag-rest">Nasasho</span>'};
  if(t==='hiit') return {cls:'is-hiit', tag:'<span class="type-tag tag-hiit">HIIT / Cardio</span>'};
  return {cls:'is-strength', tag:'<span class="type-tag tag-strength">Xoog</span>'};
}

function renderWeek() {
  const w = weekData[currentWeek];
  let dots = '';
  for(let i=0;i<7;i++) dots += `<div class="int-dot${i<w.intensity?' on':''}"></div>`;

  let html = `<div class="week-banner">
    <div class="wk-left">
      <div class="wk-number">0${w.week}</div>
      <div class="wk-info">
        <h2>${w.title}</h2>
        <p>${w.focus}</p>
      </div>
    </div>
    <div class="intensity-bar">${dots}</div>
  </div>
  <div class="days-grid">`;

  w.days.forEach(d => {
    const ti = typeInfo(d.type);
    const done = completedDays.has(d.day);
    html += `<div class="day-card ${ti.cls}${done?' done-card':''}">
      <div class="card-head">
        <span class="day-num-badge">MAALIN ${d.day}</span>
        ${ti.tag}
      </div>
      <div class="card-title">${d.title}</div>`;

    if(d.type==='rest') {
      html += `<div class="card-rest-msg">Naso, murqahu waxay kordhinayaan nasashada. Biyo cab, protein cun, 8 saacadood hur.</div>`;
    } else {
      html += `<table class="exercise-table">`;
      d.exercises.forEach(e => {
        const ex = exerciseDB[e.n];
        const isAb = ex && ex.calool;
        html += `<tr>
          <td><span class="ex-name" onclick="openModal('${e.n}')">${e.n}</span></td>
          <td>
            <div class="ex-badges">
              ${isAb?'<span class="badge badge-ab">Calool</span>':''}
              <span class="badge badge-kg">${e.kg}</span>
              <span class="badge badge-sets">${e.s}</span>
            </div>
          </td>
        </tr>`;
      });
      html += `</table>`;
    }

    html += `<div style="padding:10px 16px;border-top:1px solid rgba(255,255,255,0.06);">
      <button onclick="toggleDone(${d.day}, this)" style="font-size:11px;letter-spacing:1px;text-transform:uppercase;background:transparent;border:1px solid rgba(255,255,255,0.1);color:${done?'var(--accent)':'var(--text3)'};padding:5px 12px;border-radius:4px;cursor:pointer;width:100%;transition:all 0.2s;${done?'border-color:var(--accent);':''}">${done?'✓ LA DHAMAYSTIRAY':'CALAAMADEE DHAMEEN'}</button>
    </div>`;
    html += `</div>`;
  });

  html += `</div>`;
  document.getElementById('weekContent').innerHTML = html;
}

function toggleDone(dayNum, btn) {
  if(completedDays.has(dayNum)) {
    completedDays.delete(dayNum);
    btn.textContent = 'CALAAMADEE DHAMEEN';
    btn.style.color = 'var(--text3)';
    btn.style.borderColor = 'rgba(255,255,255,0.1)';
  } else {
    completedDays.add(dayNum);
    btn.textContent = '✓ LA DHAMAYSTIRAY';
    btn.style.color = 'var(--accent)';
    btn.style.borderColor = 'var(--accent)';
  }
  saveCompleted();
  updateProgress();
}

function updateProgress() {
  const pct = Math.round((completedDays.size / 50) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

function openModal(name) {
  const ex = exerciseDB[name];
  if(!ex) return;
  document.getElementById('mTitle').textContent = name;
  document.getElementById('mMuscle').textContent = ex.muscle;
  document.getElementById('mHow').textContent = ex.how;
  document.getElementById('mKg').innerHTML = ex.kg.replace(/·/g, '<strong>·</strong>');
  document.getElementById('mAbChip').innerHTML = ex.calool ? '<div class="ab-chip">CALOOLAHA KA CAAWIYA</div>' : '';
  document.getElementById('mYT').href = ex.yt;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if(e.target === this) closeModal();
});

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

buildTabs();
renderWeek();
updateProgress();
</script>
</body>
</html>
